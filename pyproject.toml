[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cardio-trace-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PyJWT[crypto]>=2.8.0",
    "httpx>=0.27.0",
    "auth0-fastapi>=1.0.0b6",
    "auth0-python>=5.1.0",
    "fastapi[standard]>=0.135.2",
    "python-dotenv>=1.0.0",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=app.gateway --cov=app.deps --cov=app.routes --cov=app.error_handlers --cov-fail-under=80"
testpaths = ["tests"]
asyncio_mode = "auto"
