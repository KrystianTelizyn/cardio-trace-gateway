services:
  api:
    image: cardio-trace-backend-api:dev
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  gateway:
    image: cardio-trace-gateway:dev
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"

  db:
    image: postgres:17
    container_name: cardio-trace-pg
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-cardio_trace}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: cardio-trace-pgdata
